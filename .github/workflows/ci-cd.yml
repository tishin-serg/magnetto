name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: magnetto-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: .\mvnw.cmd test

      - name: Build package
        run: .\mvnw.cmd -DskipTests package

  deploy:
    name: Deploy to vdska_pl
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VDS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VDS_PORT:-22}" "$VDS_HOST" >> ~/.ssh/known_hosts

      - name: Upload source
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          tar -czf /tmp/magnetto-source.tar.gz \
            --exclude='./target' \
            --exclude='./.git' \
            --exclude='./.agents' \
            --exclude='./.codex' \
            --exclude='./.env' \
            --exclude='./*.tar.gz' \
            --exclude='./*.zip' \
            --exclude='./*.jar' \
            .
          scp -P "${VDS_PORT:-22}" /tmp/magnetto-source.tar.gz "$VDS_USER@$VDS_HOST:/tmp/magnetto-source-${GITHUB_SHA}.tar.gz"

      - name: Build and restart on server
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          ssh -p "${VDS_PORT:-22}" "$VDS_USER@$VDS_HOST" "sudo /usr/local/sbin/magnetto-deploy /tmp/magnetto-source-${GITHUB_SHA}.tar.gz"
